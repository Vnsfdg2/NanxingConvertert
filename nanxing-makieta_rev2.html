<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nanxing 6S · STEP → SCX — makieta</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg0:#0e0e0e;--bg1:#121212;--bg2:#161616;--bg3:#1b1b1b;--line:#252525;--line2:#303030;--acc:#0e8ab0;--acc2:#14a8d4;--tx:#cdd1d4;--tx2:#8a9096;--tx3:#5b6167;--warn:#d6a24a;--bad:#c4584f;--ok:#5fae6d;
--sans:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg0);color:var(--tx);font:12px/1.4 var(--sans);overflow:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#0f0f0f}::-webkit-scrollbar-thumb{background:#2a2a2a;border:2px solid #0f0f0f}::-webkit-scrollbar-thumb:hover{background:#383838}
#app{display:grid;grid-template-rows:28px 26px 42px minmax(0,1fr) 22px;height:100vh;min-width:1180px;min-height:640px}
.i{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:square;stroke-linejoin:miter;flex:none}
/* title + menu */
#titlebar{display:flex;align-items:center;background:var(--bg0);border-bottom:1px solid var(--line);user-select:none}
#titlebar .ico{width:30px;display:grid;place-items:center;color:var(--acc2)}
#titlebar .ttl{flex:1;font-size:11.5px;color:var(--tx2)}#titlebar .ttl b{color:var(--tx);font-weight:500}
.wc{display:flex;height:100%}.wc button{width:44px;display:grid;place-items:center;color:var(--tx2)}.wc button:hover{background:#1f1f1f}.wc button.x:hover{background:#a3322b;color:#fff}
#menubar{display:flex;background:var(--bg1);border-bottom:1px solid var(--line);position:relative;user-select:none}
.mi{position:relative;padding:0 11px;display:flex;align-items:center;color:var(--tx2);cursor:default}
.mi:hover,.mi.open{background:#1d1d1d;color:var(--tx)}
.dd{position:absolute;top:100%;left:0;background:#151515;border:1px solid #2c2c2c;min-width:270px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.55);padding:3px 0}
.dd .it{display:flex;justify-content:space-between;gap:24px;padding:5px 14px;color:var(--tx);white-space:pre}
.dd .it:hover{background:#0c3a49}.dd .it span:last-child{color:var(--tx3);font-family:var(--mono);font-size:10.5px}
.dd .sep{height:1px;background:var(--line);margin:3px 0}
/* toolbar */
#toolbar{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
.tbtn{display:flex;align-items:center;gap:7px;height:30px;padding:0 11px;border:1px solid transparent;color:var(--tx)}
.tbtn:hover{background:#1f1f1f;border-color:#2e2e2e}
.tbtn.pri{border-color:#0e6d8b;background:#0c3a49;color:#c4ecf8}.tbtn.pri:hover{background:#0f4b5f}
.tsep{width:1px;height:20px;background:var(--line);margin:0 6px}
.tpath{margin-left:auto;color:var(--tx3);font:11px var(--mono)}
/* main */
#main{display:grid;grid-template-columns:288px minmax(0,1fr) 400px;min-height:0}
.ph,.ch{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:10.5px;letter-spacing:.08em;color:var(--tx2);text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.sub{color:var(--tx3);letter-spacing:0;text-transform:none;font:10.5px var(--mono)}
/* left */
#left{background:var(--bg1);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.search{padding:8px 10px;border-bottom:1px solid var(--line);position:relative;flex:none}
.search input{width:100%;height:28px;background:var(--bg0);border:1px solid var(--line2);color:var(--tx);padding:0 26px 0 28px;font:inherit}
.search input:focus{outline:0;border-color:var(--acc)}.search .i{position:absolute;left:18px;top:15px;color:var(--tx3)}
.search .clr{position:absolute;right:14px;top:9px;width:20px;height:26px;color:var(--tx3)}
#plist{flex:1;overflow:auto;min-height:0}
.pi{padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);border-left:2px solid transparent;cursor:pointer}
.pi:hover{background:#171717}.pi.sel{background:#112129;border-left-color:var(--acc2)}
.pi .r1{display:flex;justify-content:space-between;align-items:baseline}
.pn{font:500 12px var(--mono);color:var(--tx)}.pxn{font:10.5px var(--mono);color:var(--tx3)}
.dm{font:11px var(--mono);color:var(--tx2);margin-top:1px}
.or{font-size:10.5px;color:var(--tx3);margin-top:3px;display:flex;align-items:center;gap:6px}
.or i{width:5px;height:5px;background:var(--ok);flex:none}.or.w{color:var(--warn)}.or.w i{background:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.tag{display:inline-flex;align-items:center;height:16px;padding:0 6px;font-size:10px;color:var(--tx2);border:1px solid #2a2a2a;background:#151515;border-left:2px solid var(--c)}
.tag.empty{background:repeating-linear-gradient(45deg,#151515 0 4px,#1a1a1a 4px 8px);color:var(--tx3)}
.pi.em .pn{color:var(--tx2)}
.lfoot{padding:6px 12px;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--tx3);background:var(--bg2);flex:none}
.emptyl{padding:20px;color:var(--tx3);text-align:center}
/* center */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg0)}
.cbar{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;background:var(--bg2);border-bottom:1px solid var(--line);flex:none;overflow:hidden}
.seg{display:flex;border:1px solid var(--line2)}.seg button{padding:0 12px;height:24px;color:var(--tx2)}
.seg button+button{border-left:1px solid var(--line2)}.seg button.on{background:#0c3a49;color:#d2f0fa}.seg button:hover:not(.on){background:#1b1b1b}
.vsep{width:1px;height:18px;background:var(--line2)}
.xb{height:24px;padding:0 9px;border:1px solid var(--line2);background:#141414;display:flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap}
.xb:hover{border-color:var(--acc);background:#171c1f}
#cv{position:relative;flex:1;min-height:0;overflow:hidden;background:#0c0c0c;cursor:grab}
#cv.pan{cursor:grabbing}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ovl{position:absolute;left:12px;top:10px;font:11px/1.6 var(--mono);color:var(--tx3);pointer-events:none}
.ovl b{color:var(--tx);font-weight:500}.ovl span{color:var(--tx2)}
.ovr{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
.chip{font:10.5px var(--mono);padding:2px 8px;border:1px solid #3a3a3a;background:#161616;color:var(--tx2)}
.chip.w{border-color:#6b5426;color:var(--warn);background:#1c1810}.chip.b{border-color:#6b2f2a;color:#e08b83;background:#1c1211}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;border:1px solid var(--line2);background:#141414}
.zoom button{width:26px;height:26px;display:grid;place-items:center;color:var(--tx2)}.zoom button:hover{background:#1f1f1f;color:var(--tx)}.zoom button+button{border-top:1px solid var(--line2)}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#12242b;border:1px solid #1d5568;color:#cdeaf3;padding:6px 14px;font-size:11.5px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
#legend{display:flex;flex-wrap:wrap;align-items:center;gap:5px 18px;padding:9px 12px;border-top:1px solid var(--line);background:var(--bg1);flex:none}
#legend .lt{font-size:10px;letter-spacing:.08em;color:var(--tx3);text-transform:uppercase}
.lg{display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:11.5px;cursor:pointer;user-select:none}
.lg:hover{color:var(--tx)}.lg.off{opacity:.35;text-decoration:line-through}
/* svg elements */
#svg text{font-family:var(--mono);fill:var(--tx2);user-select:none;pointer-events:none}
#svg .grid{stroke:#161616;stroke-width:1;vector-effect:non-scaling-stroke}#svg .grid.m{stroke:#1e1e1e}
#svg .part{fill:#171a1d;stroke:#3d444a;stroke-width:1;vector-effect:non-scaling-stroke}
#svg .part.bottom{fill:#1a1816}#svg .part.xray{fill:#16191c}
#svg .dim{stroke:#3a4046;stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
#svg .elab{fill:#555;paint-order:stroke;stroke:#121416;stroke-width:3px;stroke-linejoin:round}#svg .elab.on{fill:#aeb4b8}
#svg .op{cursor:pointer}
#svg .op .fs{fill:var(--c);fill-opacity:.2;stroke:var(--c);stroke-width:1;vector-effect:non-scaling-stroke}
#svg .op .thick{stroke:var(--c);stroke-opacity:.5;fill:none}
#svg .op .ctr{stroke:var(--c);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
#svg .op .dash{stroke-dasharray:4 3}
#svg .op.ghost .fs,#svg .op.ghost .ctr{stroke-dasharray:4 3}#svg .op.ghost{opacity:.75}
#svg .op.skip{opacity:.3}#svg .op.skip .fs,#svg .op.skip .ctr{stroke-dasharray:2 3}
#svg .op:hover{filter:brightness(1.4)}
#svg .op.sel{filter:drop-shadow(0 0 3px rgba(255,255,255,.9)) brightness(1.3)}
#svg .selbox{fill:none;stroke:#fff;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
#svg .colbox{fill:none;stroke:var(--warn);stroke-width:1;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
#svg .claw{fill:#23272a;fill-opacity:.93;stroke:#5a636a;stroke-width:1;vector-effect:non-scaling-stroke}
#svg .claw.bad{stroke:var(--bad);fill:#2b1b1a}#svg .jaw{fill:#434b52}#svg .claw.bad+.jaw{fill:#7a3a35}
#svg .pin{fill:#23272a;stroke:#7a838a;stroke-width:1;vector-effect:non-scaling-stroke}
#svg .pcr{stroke:#7a838a;stroke-width:1;vector-effect:non-scaling-stroke}
/* right */
#right{background:var(--bg1);display:flex;flex-direction:column;min-height:0;overflow:auto;border-left:1px solid var(--line)}
.card{border-bottom:1px solid var(--line);flex:none}
.card.grow{flex:1;display:flex;flex-direction:column;min-height:330px;border-bottom:0}
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin:10px 12px 6px;border:1px solid var(--line)}
.dc{background:var(--bg0);padding:6px 9px}
.dc label{display:block;font-size:10px;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase}
.dc .v{font:500 16px var(--mono);color:var(--tx)}.dc .u{font-size:10px;color:var(--tx3);margin-left:3px}
.grn{display:flex;align-items:center;gap:10px;padding:0 12px 10px}
.grn>span:first-child{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.grn .seg button{height:22px;padding:0 10px;font-size:11px}
.grn .gi{font:10.5px var(--mono);color:var(--tx3);margin-left:auto;white-space:nowrap}
#svg .grain{pointer-events:none}
#svg .grain polyline{fill:none;stroke:#b3a07a;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.dmeta{padding:0 12px 10px;font:10.5px/1.5 var(--mono);color:var(--tx3)}.dmeta b{color:var(--tx2);font-weight:400}
.egrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px 6px}
.ef{border:1px solid var(--line2);background:var(--bg0);padding:5px 6px 6px;text-align:left;position:relative;display:block}
.ef:hover{border-color:#44525a}.ef.sel{border-color:var(--acc2);background:#10222a}
.ef .f{font:500 11px var(--mono);color:var(--acc2)}.ef .s{font-size:9.5px;color:var(--tx3);float:right;margin-top:1px}
.ef .c{font:11px var(--mono);margin-top:4px;color:var(--tx);white-space:nowrap}.ef.none .c{color:var(--tx3)}
.ef .src{position:absolute;right:4px;bottom:5px;width:5px;height:5px;background:var(--acc)}.ef .src.m{background:var(--warn)}
.ehint{padding:0 12px 9px;font-size:10.5px;color:var(--tx3)}
.rule{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;border-bottom:1px solid #1b1b1b;cursor:pointer;user-select:none}
.rule:last-child{border:0}.rule:hover{background:#151515}
.rr{display:flex;align-items:center}.rc{font:10px var(--mono);color:var(--tx2);border:1px solid #2a2a2a;padding:0 5px;margin-right:9px}
.sw{position:relative;width:30px;height:14px;background:#1d1d1d;border:1px solid #363636;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:8px;height:8px;background:#666;transition:.12s}
.sw.on{background:#0b3442;border-color:var(--acc)}.sw.on::after{left:18px;background:var(--acc2)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.tab{padding:0 14px;height:30px;color:var(--tx2);border-right:1px solid var(--line);border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.tab.on{color:var(--tx);background:var(--bg1);border-bottom-color:var(--acc2)}.tab:hover:not(.on){background:#191919}
.bd{font:10px var(--mono);color:var(--tx3);border:1px solid #2a2a2a;padding:0 5px}
.tabbody{flex:1;overflow:auto;min-height:0}
.tfoot{flex:none;padding:5px 12px;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--tx3);background:var(--bg2)}
table.ot{width:100%;border-collapse:collapse}
.ot th{white-space:nowrap;position:sticky;top:0;background:#171717;text-align:left;font-weight:500;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);padding:5px 8px;border-bottom:1px solid var(--line);z-index:1}
.ot td{padding:5px 8px;border-bottom:1px solid #1a1a1a;vertical-align:top;font-size:11px}
.ot tr{cursor:pointer}.ot tbody tr:hover{background:#171717}
.ot tr.sel{background:rgba(20,168,212,.14);box-shadow:inset 2px 0 var(--acc2)}
.ot .n{font:10.5px var(--mono);color:var(--tx3);white-space:nowrap}
.ot .on{font:500 10.5px var(--mono);letter-spacing:.02em;white-space:nowrap}.ot .kb{display:inline-block;width:7px;height:7px;margin-right:6px}
.ot .sd{color:var(--tx3);font-size:10.5px;margin-left:13px}
.ot .m{font:10.5px/1.45 var(--mono);color:var(--tx2);white-space:nowrap}
.ot .pm{font:10.5px/1.4 var(--mono);color:var(--tx2)}
.ot .wn{color:var(--warn)}.ot .sk{color:var(--bad)}
.ot tr.skip .on,.ot tr.skip .pm{opacity:.5;text-decoration:line-through}.ot tr.skip .sk{text-decoration:none}
.ot .emp{padding:24px;text-align:center;color:var(--tx3);cursor:default}
.chead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:#171717;border-bottom:1px solid var(--line)}
.chead .fn{font:11px var(--mono);color:var(--tx2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead .xb{height:22px;font-size:11px}
.code{font:11px/1.6 var(--mono);padding:5px 0 12px}
.cl{display:flex;white-space:pre;cursor:default}.cl.o{cursor:pointer}
.cl .no{width:36px;text-align:right;color:#444;padding-right:10px;flex:none;user-select:none}
.cl:hover{background:#151515}.cl.hl{background:rgba(20,168,212,.14);box-shadow:inset 2px 0 var(--acc2)}
.cm{color:#5d6a60}.sec{color:#c7a15a}.ln{color:#6e767c}.k{color:#7f8b93}
/* status */
#statusbar{display:flex;align-items:center;gap:20px;padding:0 10px;background:#0d1114;border-top:1px solid var(--line);font:10.5px var(--mono);color:var(--tx2);position:relative;overflow:hidden}
#statusbar .gr{flex:1}#sbMsg{color:var(--tx)}#sbMsg.b{color:var(--acc2)}
#sbProg{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--acc2)}
/* modal */
.ov-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:200}
.dlg{width:600px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;background:#141414;border:1px solid #333;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 6px 0 14px;background:#191919;border-bottom:1px solid var(--line);font-weight:500}
.dx{width:28px;height:26px;color:var(--tx2)}.dx:hover{background:#a3322b;color:#fff}
.db{padding:14px;overflow:auto;font-size:12px;line-height:1.55}
.db pre{font:11px/1.6 var(--mono);background:var(--bg0);border:1px solid var(--line);padding:8px 10px;color:var(--tx2);overflow:auto}
.db table{width:100%;border-collapse:collapse;font:11px var(--mono)}.db th{text-align:left;color:var(--tx3);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line2)}.db td{padding:4px 6px;border-bottom:1px solid #1c1c1c;color:var(--tx2)}
.db .ok{color:var(--ok)}.db .wr{color:var(--warn)}.db .mu{color:var(--tx3)}
.db .fld{display:flex;gap:8px;align-items:center;margin-bottom:10px}.db .fld input{flex:1;height:26px;background:var(--bg0);border:1px solid var(--line2);color:var(--tx);padding:0 8px;font:11px var(--mono)}
.df{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:#161616}
.dbtn{height:28px;padding:0 16px;border:1px solid var(--line2);background:#1a1a1a}.dbtn:hover{background:#222}
.dbtn.pri{border-color:#0e6d8b;background:#0c3a49;color:#c4ecf8}.dbtn.pri:hover{background:#0f4b5f}
.sdlg{width:780px;max-width:94vw}
.sbody{display:grid;grid-template-columns:170px minmax(0,1fr);height:min(480px,64vh);min-height:0}
.sbody nav{border-right:1px solid var(--line);background:#111;padding:8px 0;display:flex;flex-direction:column}
.sbody nav button{text-align:left;padding:8px 16px;color:var(--tx2);border-left:2px solid transparent}
.sbody nav button:hover{background:#181818}.sbody nav button.on{background:#112129;color:var(--tx);border-left-color:var(--acc2)}
.snote{margin-top:auto;padding:10px 14px;font-size:10.5px;color:var(--tx3);line-height:1.5}
.sform{overflow:auto;padding:4px 18px 14px}
.sform h3{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:500;padding:10px 0 6px;border-bottom:1px solid var(--line)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:16px;align-items:center;padding:9px 0;border-bottom:1px solid #1b1b1b}
.frow .fl{color:var(--tx)}.frow.chg .fl::after{content:'';display:inline-block;width:5px;height:5px;background:var(--warn);margin-left:8px;vertical-align:middle}
.fh{font-size:10.5px;color:var(--tx3);margin-top:1px;line-height:1.4}
.fi{display:flex;align-items:center;gap:6px}
.fi input{flex:1;min-width:0;height:26px;background:var(--bg0);border:1px solid var(--line2);color:var(--tx);padding:0 8px;font:12px var(--mono);text-align:right}
.fi input[type=text]{text-align:left}.fi input:focus{outline:0;border-color:var(--acc)}
.fu{width:38px;font:10.5px var(--mono);color:var(--tx3)}
.fr{width:22px;height:22px;color:var(--tx2);border:1px solid var(--line2)}.fr:hover:not(:disabled){border-color:var(--acc);color:var(--tx)}.fr:disabled{opacity:.25;cursor:default}
#tip{position:fixed;pointer-events:none;z-index:300;background:#1a1f22;border:1px solid #2f3a40;padding:4px 8px;font:11px/1.45 var(--mono);color:var(--tx);display:none;white-space:pre}
</style>
</head>

const dirOf=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;return Math.abs(dx)>Math.abs(dy)?(dx>0?'+X':'-X'):(dy>0?'+Y':'-Y');};

/* ---------- budowa operacji ---------- */
function buildOps(p){
  const out=[],T=p.T;
  const sw=f=>p.flip?(f==='top'?'bottom':f==='bottom'?'top':f):f;
  const fname=f=>f==='top'?'Góra':f==='bottom'?'Dół':f;
  p.ops.forEach((o,i)=>{
    const id='o'+(i+1),no='N'+String((i+1)*10).padStart(3,'0');
    const b={id,no,kind:o.t,active:true,reason:'',warn:''};
    if(o.t==='vdrill'){
      const q=pt(p,o.u,o.v),r=o.d/2;
      const partial=o.u-r<-0.01||o.u+r>p.L+0.01||o.v-r<-0.01||o.v+r>p.W+0.01;
      const through=o.depth>=T,z=o.depth+(R.cone?S.coneK*o.d:0);
      if(partial&&!R.partial){b.active=false;b.reason='otwór częściowy wyłączony';}
      Object.assign(b,{x:q[0],y:q[1],r,d:o.d,z,partial,through,face:through?'both':sw('top'),side:through?'Przelot':fname(sw('top')),bbox:[q[0]-r,q[1]-r,q[0]+r,q[1]+r],pos:q,
        params:`Ø${o.d} · gł. ${fx(o.depth,1)}`+(R.cone?` → Z −${fx(z,1)}`:'')+(partial?' · częściowy':'')});
    }else if(o.t==='sdrill'){
      const dE=R.limit?Math.min(o.depth,S.limit):o.depth,cl=R.limit&&o.depth>S.limit,z=o.z!=null?o.z:T/2;
      const a=pt(p,...edgePoint(p,o.e,o.s,0)),c=pt(p,...edgePoint(p,o.e,o.s,dE));
      Object.assign(b,{x1:a[0],y1:a[1],x2:c[0],y2:c[1],d:o.d,e:o.e,dE,z,dir:dirOf(a[0],a[1],c[0],c[1]),face:'edge',side:`${o.e} · ${sideName(p,o.e)}`,
        bbox:bboxLine(a[0],a[1],c[0],c[1],o.d/2),pos:a,
        params:`Ø${o.d} · gł. ${fx(dE,1)}`+(cl?` (z ${o.depth})`:'')+` · Z${fx(z,1)}`,warn:cl?`ograniczono do ${S.limit} mm`:''});
    }else if(o.t==='lamello'){
      const lh=S.lamW/2,ld=S.lamD,pts=[[o.s-lh,0],[o.s+lh,0],[o.s+lh,ld],[o.s-lh,ld]].map(q=>pt(p,...edgePoint(p,o.e,q[0],q[1])));
      const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]),c=pt(p,...edgePoint(p,o.e,o.s,0));
      Object.assign(b,{pts,e:o.e,face:'edge',side:`${o.e} · ${sideName(p,o.e)}`,bbox:[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)],pos:c,params:`P14 · ${S.lamW} × ${S.lamD} mm`,
        dir:dirOf(...c,...pt(p,...edgePoint(p,o.e,o.s,ld)))});
    }else if(o.t==='groove'){
      const a=pt(p,o.u1,o.v1),c=pt(p,o.u2,o.v2),len=Math.hypot(c[0]-a[0],c[1]-a[1]),ax=Math.abs(c[1]-a[1])<0.01;
      Object.assign(b,{x1:a[0],y1:a[1],x2:c[0],y2:c[1],w:o.w,depth:o.depth,len,alignedX:ax,face:sw('top'),side:fname(sw('top')),bbox:bboxLine(a[0],a[1],c[0],c[1],o.w/2),pos:a,
        params:`${o.w} × ${o.depth} · L ${fx(len,0)} · oś ${ax?'X':'Y'}`,warn:ax?'':'oś Y — piła X nie przetnie'});
    }else if(o.t==='mill'){
      if(o.shape==='pocket'){
        const a=pt(p,o.u,o.v),c=pt(p,o.u+o.w,o.v+o.h),bb=[Math.min(a[0],c[0]),Math.min(a[1],c[1]),Math.max(a[0],c[0]),Math.max(a[1],c[1])];
        Object.assign(b,{shape:'pocket',bbox:bb,pos:[bb[0],bb[1]],w:bb[2]-bb[0],h:bb[3]-bb[1],r:o.r,tool:o.tool,tn:o.tn,depth:o.depth,face:sw('top'),side:fname(sw('top')),
          params:`${o.tn} Ø${o.tool} · kieszeń ${o.w}×${o.h} · gł. ${o.depth}`});
      }else{
        const a=pt(p,o.u1,o.v1),c=pt(p,o.u2,o.v2),len=Math.hypot(c[0]-a[0],c[1]-a[1]);
        Object.assign(b,{shape:'slot',x1:a[0],y1:a[1],x2:c[0],y2:c[1],tool:o.tool,tn:o.tn,depth:o.depth,face:sw('top'),side:fname(sw('top')),bbox:bboxLine(a[0],a[1],c[0],c[1],o.tool/2),pos:a,
          params:`${o.tn} Ø${o.tool} · rowek L ${fx(len,0)} · gł. ${o.depth}`});
      }
    }else if(o.t==='bottom'){
      const a=pt(p,o.u1,o.v1),c=pt(p,o.u2,o.v2),len=Math.hypot(c[0]-a[0],c[1]-a[1]);
      if(!R.bottom){b.active=false;b.reason='dolny frez wyłączony';}
      Object.assign(b,{x1:a[0],y1:a[1],x2:c[0],y2:c[1],w:o.w,depth:o.depth,face:sw('bottom'),side:fname(sw('bottom')),bbox:bboxLine(a[0],a[1],c[0],c[1],o.w/2),pos:a,
        params:`Ø${S.bottomD} · szer. ${o.w} · gł. ${o.depth} · L ${fx(len,0)}`});
    }

  out.forEach(o=>{
    if(!o.active)return;
    cl.forEach((c,i)=>{if(o.bbox[0]<c.x1+3&&o.bbox[2]>c.x0-3&&o.bbox[1]<c.y1&&o.bbox[3]>c.y0){o.collide=true;p._bad[i]=true;}});
  });
  EK.forEach(F=>{
    if(!p.edges[F])return;
    const a=edgeLine(p,F);
    out.push({id:'e:'+F,no:'OBRZ',kind:'edge',active:true,side:`${F} · ${sideName(p,F)}`,pos:a[0],noPos:true,params:`${p.edges[F]} · ${p.esrc[F]?'ręcznie':'CSV'}`,bbox:[0,0,0,0]});
  });

}
const isEmpty=p=>p.ops.length===0;
const realOps=p=>p._ops.filter(o=>o.kind!=='edge');
function issues(p){const r=[];if(p._ops.some(o=>o.kind==='groove'&&!o.alignedX))r.push('Nuta w osi Y — dopasuj pod piłę X');const c=p._ops.filter(o=>o.collide).length;if(c)r.push(`Kolizja łapy z obróbką (${c})`);return r;}
const stepsLabel=p=>!p.steps.length?'Orientacja bazowa':p.steps.slice(0,3).map(s=>STEPL[s]).join(' · ')+(p.steps.length>3?` · +${p.steps.length-3}`:'');

/* ---------- usłojenie ---------- */
/* true = słoje wzdłuż osi X maszyny, false = wzdłuż Y, null = brak */
function grainHor(p){
  if(!p.grain)return null;
  const g=p.grain==='L'?[p.M[0],p.M[1]]:[p.M[2],p.M[3]];
  return Math.abs(g[0])>=Math.abs(g[1]);
}
/* Gęstość zależy od wymiaru POPRZECZNEGO do słojów: zawsze 4..12 linii,
   więc mała formatka ma kilka słojów, a duża nie zamienia się w gąszcz. */
function grainSVG(p,A,B,s){
  const hor=grainHor(p);if(hor===null)return '';
  const along=hor?A:B,perp=hor?B:A,px=n=>n/s,Y=y=>-y;
  const n=clamp(Math.round(perp/S.grainStep),S.grainMin,Math.max(S.grainMin,S.grainMax)),gap=perp/n,steps=clamp(Math.round(along/22),10,48);
  let h=`<defs><clipPath id="pclip"><rect x="0" y="${-B}" width="${A}" height="${B}"/></clipPath></defs><g class="grain" clip-path="url(#pclip)">`;
  for(let k=0;k<n;k++){
    const c=gap*(k+.5),amp=Math.min(gap*.24,7),per=along/(1.6+(k*7%5)*.45),ph=k*1.9;
    const t0=along*.02*(k%3),t1=along*(1-.02*((k+1)%3));
    const pts=[];
    for(let i=0;i<=steps;i++){
      const t=t0+(t1-t0)*i/steps,off=amp*Math.sin(6.2832*t/per+ph)+amp*.35*Math.sin(6.2832*t/(per*.37)+ph*2);
      pts.push(hor?`${t.toFixed(1)},${Y(c+off).toFixed(1)}`:`${(c+off).toFixed(1)},${Y(t).toFixed(1)}`);
    }
    h+=`<polyline points="${pts.join(' ')}" stroke-opacity="${k%3===0?.42:.26}" stroke-width="${k%3===0?1.4:1}"/>`;
  }
  /* strzałka kierunku w środku: długość proporcjonalna do formatki, groty stałe w px */
  const cx=A/2,cy=B/2,half=Math.min(along*.2,Math.max(along*.2,px(40))),hd=px(7);
  const ax=hor?[cx-half,cy,cx+half,cy]:[cx,cy-half,cx,cy+half];
  const head=(x,y,d)=>hor?`${x},${Y(y)} ${x+d*hd},${Y(y)-hd*.55} ${x+d*hd},${Y(y)+hd*.55}`:`${x},${Y(y)} ${x-hd*.55},${Y(y)-d*hd*-1} ${x+hd*.55},${Y(y)-d*hd*-1}`;
  if(along*s>150){
    h+=`<g style="pointer-events:none"><line x1="${ax[0]}" y1="${Y(ax[1])}" x2="${ax[2]}" y2="${Y(ax[3])}" stroke="#cdbb92" stroke-opacity=".75" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
    h+=`<polygon points="${head(ax[0],ax[1],1)}" fill="#cdbb92" fill-opacity=".8"/><polygon points="${head(ax[2],ax[3],-1)}" fill="#cdbb92" fill-opacity=".8"/></g>`;
  }
  h+='</g>';
  if(along*s>150){
    const lx=cx,ly=hor?cy+px(14):cy;
    h+=hor?`<text x="${lx}" y="${Y(ly)}" text-anchor="middle" dominant-baseline="middle" font-size="${px(10)}" style="fill:#cdbb92;fill-opacity:.85;paint-order:stroke;stroke:#171a1d;stroke-width:${px(3)}px">USŁOJENIE ↔ X</text>`
      :`<text transform="translate(${cx+px(14)} ${Y(cy)}) rotate(-90)" text-anchor="middle" dominant-baseline="middle" font-size="${px(10)}" style="fill:#cdbb92;fill-opacity:.85;paint-order:stroke;stroke:#171a1d;stroke-width:${px(3)}px">USŁOJENIE ↕ Y</text>`;
  }
  return h;
}

/* ---------- lista ---------- */
function tagsOf(p){
  const o=realOps(p),n=k=>o.filter(x=>x.kind===k).length,t=[];
  if(n('vdrill')+n('sdrill'))t.push({t:`Wiercenia ${n('vdrill')+n('sdrill')}`,c:KC.vdrill});

  if(n('mill'))t.push({t:'Frezowanie',c:KC.mill});
  if(n('bottom'))t.push({t:'Frez dolny Ø12',c:KC.bottom});
  const e=EK.filter(F=>p.edges[F]).length;if(e)t.push({t:`Obrzeża CSV ${e}/4`,c:KC.edge});
  const gh=grainHor(p);if(gh!==null)t.push({t:'Usłojenie '+(gh?'↔':'↕'),c:KC.grain});

}

/* ---------- podgląd SVG ---------- */
function opSVG(o,s){
  const px=n=>n/s,Y=y=>-y;let g='';
  if(o.kind==='vdrill'){const r=Math.max(o.r,px(3));
    g=`<circle class="fs" cx="${o.x}" cy="${Y(o.y)}" r="${r}"/><path class="ctr" d="M${o.x-r*1.5} ${Y(o.y)}H${o.x+r*1.5}M${o.x} ${Y(o.y)-r*1.5}V${Y(o.y)+r*1.5}"/>`;
  }else if(o.kind==='sdrill'){
    g=`<line class="thick" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}" stroke-width="${Math.max(o.d,px(2.5))}"/><line class="ctr" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}"/><circle class="fs" cx="${o.x1}" cy="${Y(o.y1)}" r="${px(3)}"/>`;
  }else if(o.kind==='lamello'){
    g=`<polygon class="fs" points="${o.pts.map(q=>q[0]+','+Y(q[1])).join(' ')}"/>`;
  }else if(o.kind==='groove'){
    g=`<line class="thick" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}" stroke-width="${Math.max(o.w,px(2.5))}"/><line class="ctr dash" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}"/>`;
  }else if(o.kind==='mill'&&o.shape==='pocket'){
    const bb=o.bbox,w=bb[2]-bb[0],h=bb[3]-bb[1],rr=Math.min(o.r,w/2,h/2),ins=o.tool/2;
    g=`<rect class="fs" x="${bb[0]}" y="${Y(bb[3])}" width="${w}" height="${h}" rx="${rr}"/>`;
    if(w>o.tool&&h>o.tool)g+=`<rect class="ctr dash" x="${bb[0]+ins}" y="${Y(bb[3])+ins}" width="${w-o.tool}" height="${h-o.tool}" rx="${Math.max(rr-ins,0)}"/>`;
  }else if(o.kind==='mill'){
    g=`<line class="thick" stroke-linecap="round" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}" stroke-width="${Math.max(o.tool,px(2.5))}"/><line class="ctr dash" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}"/>`;
  }else if(o.kind==='bottom'){
    const bb=o.bbox;g=`<rect class="fs" style="stroke-dasharray:5 3" x="${bb[0]}" y="${Y(bb[3])}" width="${bb[2]-bb[0]}" height="${bb[3]-bb[1]}"/><line class="ctr" x1="${o.x1}" y1="${Y(o.y1)}" x2="${o.x2}" y2="${Y(o.y2)}"/>`;
  }
  return g;
}
function visible(o){

function renderCanvas(){

  });

  const d1=px(36);
  h+=`<path class="dim" d="M0 ${d1}H${A}M0 ${d1-px(4)}V${d1+px(4)}M${A} ${d1-px(4)}V${d1+px(4)}M${-d1} 0V${-B}M${-d1-px(4)} 0H${-d1+px(4)}M${-d1-px(4)} ${-B}H${-d1+px(4)}"/>`;
  h+=`<text x="${A/2}" y="${d1+px(14)}" text-anchor="middle" font-size="${px(11)}">X = ${fx(A)} mm</text>`;
  h+=`<text transform="translate(${-d1-px(8)} ${-B/2}) rotate(-90)" text-anchor="middle" font-size="${px(11)}">Y = ${fx(B)} mm</text>`;
  /* operacje */
  p._ops.forEach(o=>{
    if(o.kind==='edge'||!visible(o))return;
    const cls=['op'];if(!o.active)cls.push('skip');if(view.mode==='xray'&&o.face==='bottom')cls.push('ghost');if(sel&&sel.type==='op'&&sel.id===o.id)cls.push('sel');

  });

  });

    h+=`<rect class="selbox" x="${bb[0]-m}" y="${Y(bb[3])-m}" width="${bb[2]-bb[0]+2*m}" height="${bb[3]-bb[1]+2*m}"/><text x="${bb[0]-m}" y="${Y(bb[3])-m-px(5)}" font-size="${px(10.5)}" style="fill:#fff">${so.no} · ${KS[so.kind]}</text>`;}
  /* łapy */

    h+=`<rect class="claw${p._bad[i]?' bad':''}" x="${c.x0}" y="${Y(c.y1)}" width="${c.x1-c.x0}" height="${c.y1-c.y0}"/><rect class="jaw" x="${c.x0}" y="${Y(B)}" width="${c.x1-c.x0}" height="${S.clawGrip}"/>`;

  });

  /* baza (0,0) */
  const al=px(46),ah=px(6);

  h+=`<line x1="0" y1="0" x2="0" y2="${-al}" stroke="#5fa86c" stroke-width="1.6" vector-effect="non-scaling-stroke"/><polygon points="0,${-al} ${-ah/2},${-al+ah} ${ah/2},${-al+ah}" fill="#5fa86c"/>`;
  h+=`<text x="${al+px(4)}" y="${px(11)}" font-size="${px(10)}" style="fill:#b85c5c">X</text><text x="${-px(11)}" y="${-al}" font-size="${px(10)}" style="fill:#5fa86c">Y</text>`;
  h+=`<circle cx="0" cy="0" r="${px(6)}" fill="#0c0c0c" stroke="#14a8d4" stroke-width="1.5" vector-effect="non-scaling-stroke"/><path d="M${-px(10)} 0H${px(10)}M0 ${-px(10)}V${px(10)}" stroke="#14a8d4" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  h+=`<text x="${-px(12)}" y="${px(18)}" text-anchor="end" font-size="${px(10.5)}" style="fill:#14a8d4">(0,0)</text>`;
  h+=el;
  svg.innerHTML=h;
  /* nakładki */
  const vn={xray:'X-Ray',top:'Góra',bottom:'Dół'}[view.mode];
  $('#ovl').innerHTML=`<b>${esc(p.name)}</b><br>${p.L} × ${p.W} × ${p.T} mm &nbsp;·&nbsp; Widok: <b>${vn}</b>${p.flip?' <span>(strona B)</span>':''}<br><span>Stół: X ${fx(A)} × Y ${fx(B)} &nbsp;·&nbsp; ${esc(stepsLabel(p))}</span>`;
  {const gh=grainHor(p);$('#ovl').innerHTML+=`<br><span>Usłojenie: ${gh===null?'brak':gh?'poziomo (oś X)':'pionowo (oś Y)'}</span>`;}
  const is=issues(p);let ov='';

  const sk=realOps(p).filter(o=>!o.active).length;if(sk)ov+=`<span class="chip b">${sk} op. pominięto przez reguły</span>`;

/* ---------- kod ---------- */
function genCode(p){
  const L=[],add=(t,id,kind)=>L.push({t,id,kind}),f=fx;
  add('; ===== NANXING 6-SIDE DRILL · SCX (podglad - makieta) =====');
  add(`; STEP     : ${p.file}`);add(`; WYGEN.   : ${stamp}`);add('');
  add('[PART]');
  add(`NAME     = ${p.name}`);
  add(`SIZE     = ${f(p.L)} x ${f(p.W)} x ${f(p.T)}`);
  add(`TABLE    = X ${f(p.A)}  Y ${f(p.B)}`);
  {const gh=grainHor(p);add(`GRAIN    = ${gh===null?'NONE':(gh?'ALONG_X':'ALONG_Y')+(p.grain==='L'?'  (wzdluz L)':'  (wzdluz W)')}`);}
  add(`XFORM    =${p.steps.length?p.steps.join(' > '):'NONE'}${p.flip?'  (FACE=BOTTOM)':''}`);
  const cl=claws(p),pp=pinPos(p);
  add(`CLAMP1   = X ${f(cl[0].x0)} .. ${f(cl[0].x1)}${p._bad[0]?'  ; WARN collision':''}`);
  add(`CLAMP2   = X ${f(cl[1].x0)} .. ${f(cl[1].x1)}${p._bad[1]?'  ; WARN collision':''}`);
  add(`PIN      = X ${f(pp[0])}  Y ${f(pp[1])}`);
  EK.forEach(F=>add(`EDGE_${F}  = ${p.edges[F]||'-'}${p.edges[F]?(p.esrc[F]?' (MANUAL)':' (CSV)'):''}`,p.edges[F]?'e:'+F:null));
  add('');add('[OPS]');
  realOps(p).forEach(o=>{
    if(!o.active){add(`; ${o.no} SKIP ${o.kind.toUpperCase()} (${o.reason})`,o.id,o.kind);return;}
    let t;
    if(o.kind==='vdrill')t=`${o.no} DRILL_V  X=${f(o.x,3)} Y=${f(o.y,3)} D=${f(o.d,1)} Z=-${f(o.z,2)}${o.through?' THRU':''} FACE=${o.face==='both'?'BOTH':o.face.toUpperCase()}`;
    else if(o.kind==='sdrill')t=`${o.no} DRILL_S  EDGE=${o.e} X=${f(o.x1,3)} Y=${f(o.y1,3)} DIR=${o.dir} D=${f(o.d,1)} DEPTH=${f(o.dE,1)} Z=${f(o.z,1)}`;
    else if(o.kind==='lamello')t=`${o.no} LAMELLO  P14 EDGE=${o.e} X=${f(o.pos[0],3)} Y=${f(o.pos[1],3)} DIR=${o.dir} DEPTH=${f(S.lamD,1)}`;
    else if(o.kind==='groove')t=(o.alignedX?'':'; ')+`${o.no} SAW_X    X1=${f(o.x1,3)} X2=${f(o.x2,3)} Y=${f(o.y1,3)} W=${f(o.w,1)} Z=-${f(o.depth,1)}`+(o.alignedX?'':'  AXIS Y - SAW CANNOT CUT');
    else if(o.kind==='mill'&&o.shape==='pocket')t=`${o.no} MILL_TOP TOOL=${o.tn} D=${f(o.tool,1)} POCKET X=${f(o.bbox[0],3)} Y=${f(o.bbox[1],3)} W=${f(o.w,1)} H=${f(o.h,1)} R=${f(o.r,1)} Z=-${f(o.depth,1)}`;
    else if(o.kind==='mill')t=`${o.no} MILL_TOP TOOL=${o.tn} D=${f(o.tool,1)} SLOT X1=${f(o.x1,3)} Y1=${f(o.y1,3)} X2=${f(o.x2,3)} Y2=${f(o.y2,3)} Z=-${f(o.depth,1)}`;
    else t=`${o.no} MILL_BOT TOOL=FIX${S.bottomD} D=${f(S.bottomD,1)} X1=${f(o.x1,3)} Y1=${f(o.y1,3)} X2=${f(o.x2,3)} Y2=${f(o.y2,3)} DEPTH=${f(o.depth,1)}`;
    add(t,o.id,o.kind);
  });
  add('');add('[END]');
  return L;
}
function hlLine(t,kind){
  let s=esc(t);
  if(/^\s*;/.test(s))return `<span class="cm">${s}</span>`;
  if(/^\[/.test(s))return `<span class="sec">${s}</span>`;
  s=s.replace(/^(N\d+)(\s+)(\S+)/,(m,a,b,c)=>`<span class="ln">${a}</span>${b}<span style="color:${kind?KC[kind]:'#ccc'}">${c}</span>`);
  s=s.replace(/^([A-Z0-9_]+)(\s*)=/,(m,a,b)=>`<span class="k">${a}</span>${b}=`);
  s=s.replace(/ ([A-Z0-9]{1,6})=/g,' <span class="k">$1</span>=');
  return s;
}

function alignSaw(){
  let n=0,conf=0,tot=0;
  PARTS.forEach(p=>{
    const g=p._ops.filter(o=>o.kind==='groove');if(!g.length)return;tot++;
    const bad=g.filter(o=>!o.alignedX).length;
    if(bad===g.length){p.steps.push('R90');recompute(p);n++;}else if(bad)conf++;
  });
  refresh();
  toast(n?`Dopasowano nuty pod piłę X: obrócono ${n} z ${tot} formatek z nutami`:conf?'Nuty w dwóch osiach — wymagany podział formatki':'Wszystkie nuty już leżą w osi X');
}

    r.querySelectorAll('input[data-k]').forEach(inp=>{
      const f=FIELDS.flatMap(s=>s.items).find(x=>x.k===inp.dataset.k);
      const mark=()=>{const ch=S[f.k]!==SD[f.k],rw=inp.closest('.frow');rw.classList.toggle('chg',ch);rw.querySelector('.fr').disabled=!ch;};
      inp.addEventListener('input',()=>{
        if(f.text){S[f.k]=inp.value.trim()||SD[f.k];}
        else{const v=parseFloat(inp.value.replace(',','.'));if(isNaN(v))return;S[f.k]=clamp(v,f.min,f.max);}
        mark();applySettings();
      });
      inp.addEventListener('change',()=>{inp.value=S[f.k];});
    });
    r.querySelectorAll('.fr').forEach(b=>b.addEventListener('click',()=>{S[b.dataset.r]=SD[b.dataset.r];applySettings();draw();}));
  }
  onModalCancel=cancel;draw();
}

/* ---------- menu ---------- */
const MENUS=[
 {n:'Plik',items:()=>[['Otwórz folder STEP…','Ctrl+O',openFolder],['Wczytaj CSV obrzeży…','Ctrl+L',openCsv],'-',['Zapisz / Generuj wszystkie SCX','Ctrl+S',saveAll],'-',['Zamknij','Alt+F4',()=>toast('Makieta: zamknięcie okna wyłączone')]]},
 {n:'Edycja',items:()=>[['Cofnij ostatnią transformację','Ctrl+Z',undo],['Reset bieżącej formatki','',()=>xf('RESET')],['Reset wszystkich formatek','',resetAll]]},
 {n:'Widok',items:()=>[[(view.mode==='xray'?'● ':'   ')+'X-Ray','1',()=>setMode('xray')],[(view.mode==='top'?'● ':'   ')+'Góra','2',()=>setMode('top')],[(view.mode==='bottom'?'● ':'   ')+'Dół','3',()=>setMode('bottom')],'-',['Dopasuj widok','F',fit],[(view.grid?'✓ ':'   ')+'Siatka 100 mm','G',()=>{view.grid=!view.grid;renderCanvas();}]]},
 {n:'Ustawienia',items:()=>[['Ustawienia…','Ctrl+,',()=>openSettings(0)],'-',['Parametry maszyny…','',()=>openSettings(0)],['Mocowanie (łapy, bolec)…','',()=>openSettings(1)],['Narzędzia…','',()=>openSettings(2)],['Podgląd…','',()=>openSettings(3)],['Eksport…','',()=>openSettings(4)],'-',['Przywróć reguły domyślne','',()=>{Object.assign(R,{cone:true,limit:true,partial:true,bottom:true,skipEmpty:true});refresh();toast('Przywrócono reguły domyślne');}],['Przywróć ustawienia fabryczne','',()=>{Object.assign(S,SD);saveSettings();applySettings();toast('Przywrócono ustawienia fabryczne');}]]},
 {n:'Narzędzia',items:()=>[['Dopasuj nuty pod piłę X','',alignSaw],['Przelicz','F5',recalc]]},
 {n:'Pomoc',items:()=>[['O programie','',about]]}
];
let openMenu=-1;
function renderMenu(){
  $('#menubar').innerHTML=MENUS.map((m,i)=>`<div class="mi${openMenu===i?' open':''}" data-i="${i}">${m.n}${openMenu===i?`<div class="dd">${m.items().map((it,j)=>it==='-'?'<div class="sep"></div>':`<div class="it" data-j="${j}"><span>${esc(it[0])}</span><span>${it[1]}</span></div>`).join('')}</div>`:''}</div>`).join('');
}

/* ---------- legenda ---------- */
function legendIcon(k){
  const c=KC[k];
  const m={
    vdrill:`<circle cx="12" cy="6" r="4" fill="${c}" fill-opacity=".25" stroke="${c}"/><path d="M6 6h12M12 1v10" stroke="${c}"/>`,
    sdrill:`<path d="M2 6h14" stroke="${c}" stroke-opacity=".55" stroke-width="4"/><path d="M2 6h14" stroke="${c}"/><circle cx="3" cy="6" r="2" fill="${c}" fill-opacity=".3" stroke="${c}"/>`,
    lamello:`<rect x="4" y="2" width="16" height="8" fill="${c}" fill-opacity=".25" stroke="${c}"/>`,
    groove:`<path d="M2 6h20" stroke="${c}" stroke-opacity=".5" stroke-width="4"/><path d="M2 6h20" stroke="${c}" stroke-dasharray="3 2"/>`,
    mill:`<rect x="3" y="2" width="18" height="8" rx="2" fill="${c}" fill-opacity=".2" stroke="${c}"/><rect x="6" y="4" width="12" height="4" rx="1" fill="none" stroke="${c}" stroke-dasharray="2 2"/>`,
    bottom:`<rect x="2" y="2" width="20" height="8" fill="${c}" fill-opacity=".25" stroke="${c}" stroke-dasharray="4 2"/>`,
    edge:`<path d="M2 6h20" stroke="${c}" stroke-width="4"/>`,
    grain:`<path d="M2 3.5c4-2 6 2 10 0s6 2 10 0M2 8.5c4-2 6 2 10 0s6 2 10 0" fill="none" stroke="${c}" stroke-opacity=".8"/>`
  };
  return `<svg width="24" height="12" viewBox="0 0 24 12" style="flex:none">${m[k]}</svg>`;
}
function renderLegend(){
  $('#legend').innerHTML='<span class="lt">Legenda</span>'+KORDER.map(k=>`<span class="lg${layerOff[k]?' off':''}" data-k="${k}" title="Klik: pokaż / ukryj warstwę">${legendIcon(k)}${KN[k]}</span>`).join('');
}

/* ---------- zdarzenia ---------- */
function bind(){
  $('#plist').addEventListener('click',e=>{const it=e.target.closest('.pi');if(it)pick(it.dataset.id);});
  $('#q').addEventListener('input',e=>{q=e.target.value;renderList();});
  $('#qclr').addEventListener('click',()=>{q='';$('#q').value='';renderList();});
  $('#vseg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);});
  $$('.cbar .xb').forEach(b=>b.addEventListener('click',()=>xf(b.dataset.x)));
  $('#bOpen').onclick=openFolder;$('#bCsv').onclick=openCsv;$('#bSaw').onclick=alignSaw;$('#bCalc').onclick=recalc;$('#bSave').onclick=saveAll;$('#bSet').onclick=()=>openSettings(0);
  $('#legend').addEventListener('click',e=>{const l=e.target.closest('.lg');if(!l)return;layerOff[l.dataset.k]=!layerOff[l.dataset.k];renderLegend();renderCanvas();});
  $('#zIn').onclick=()=>{view.zoom=clamp(view.zoom*1.25,.5,8);renderCanvas();};
  $('#zOut').onclick=()=>{view.zoom=clamp(view.zoom/1.25,.5,8);renderCanvas();};
  $('#zFit').onclick=fit;
  $('#gseg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cur().grain=b.dataset.g;refresh();});
  $('#egrid').addEventListener('click',e=>{
    const b=e.target.closest('.ef');if(!b)return;
    const F=b.dataset.f,p=cur(),i=EOPTS.indexOf(p.edges[F]),n=(i+(e.shiftKey?-1:1)+EOPTS.length)%EOPTS.length;
    p.edges[F]=EOPTS[n];p.esrc[F]=p.edges[F]!==p.csv[F];sel={type:'edge',id:F};refresh();
  });
  $('#egrid').addEventListener('mouseover',e=>{const b=e.target.closest('.ef');const F=b?b.dataset.f:null;if(F!==view.hEdge){view.hEdge=F;renderCanvas();}});
  $('#egrid').addEventListener('mouseleave',()=>{if(view.hEdge){view.hEdge=null;renderCanvas();}});
  $('#rules').addEventListener('click',e=>{const r=e.target.closest('.rule');if(!r)return;R[r.dataset.r]=!R[r.dataset.r];refresh();});
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{
    tab=t.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('on',x===t));
    $('#tbOps').hidden=tab!=='ops';$('#tbCode').hidden=tab!=='code';
    if(tab==='code'){const c=$('#codeBody .hl');if(c)c.scrollIntoView({block:'nearest'});}
  }));
  $('#tbOps').addEventListener('click',e=>{
    const r=e.target.closest('tr[data-row]');if(!r)return;const id=r.dataset.row;
    if(id.startsWith('e:'))select('edge',id.slice(2));else select('op',id);
  });
  $('#codeBody').addEventListener('click',e=>{
    const l=e.target.closest('.cl[data-cid]');if(!l)return;const id=l.dataset.cid;
    if(id.startsWith('e:'))select('edge',id.slice(2));else select('op',id);
  });
  $('#cCopy').onclick=()=>{const t=codeText(cur());if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Skopiowano kod do schowka'),()=>toast('Nie udało się skopiować'));else toast('Schowek niedostępny');};
  $('#cDl').onclick=()=>{const p=cur(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([codeText(p)],{type:'text/plain'}));a.download=p.name+'.'+S.ext;document.body.appendChild(a);a.click();a.remove();toast('Pobrano '+p.name+'.'+S.ext);};
  $$('[data-wc]').forEach(b=>b.addEventListener('click',()=>toast('Makieta: sterowanie oknem wyłączone')));
  /* menu */
  const mb=$('#menubar');
  mb.addEventListener('mousedown',e=>{
    const it=e.target.closest('.it');
    if(it){const mi=e.target.closest('.mi'),m=MENUS[+mi.dataset.i],items=m.items(),act=items[+it.dataset.j];openMenu=-1;renderMenu();if(act&&act[2])act[2]();return;}
    const mi=e.target.closest('.mi');if(!mi)return;
    openMenu=openMenu===+mi.dataset.i?-1:+mi.dataset.i;renderMenu();
  });
  mb.addEventListener('mouseover',e=>{const mi=e.target.closest('.mi');if(mi&&openMenu>=0&&+mi.dataset.i!==openMenu){openMenu=+mi.dataset.i;renderMenu();}});
  document.addEventListener('mousedown',e=>{if(openMenu>=0&&!e.composedPath().includes(mb)){openMenu=-1;renderMenu();}});
  /* podgląd: pan / klik / zoom / tooltip */
  const svg=$('#svg'),tip=$('#tip');let drag=null;
  svg.addEventListener('mousedown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,px:view.px,py:view.py,moved:false,t:e.target};});
  window.addEventListener('mousemove',e=>{
    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;$('#cv').classList.add('pan');tip.style.display='none';}
      if(drag.moved){view.px=drag.px+dx;view.py=drag.py+dy;renderCanvas();}}
  });
  window.addEventListener('mouseup',()=>{
    if(!drag)return;const d=drag;drag=null;$('#cv').classList.remove('pan');
    if(!d.moved){const t=d.t.closest&&d.t.closest('[data-op],[data-edge]');
      if(t&&t.dataset.op)select('op',t.dataset.op);else if(t&&t.dataset.edge)select('edge',t.dataset.edge);else select(null);}
  });
  svg.addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(),x=(e.clientX-r.left-vp.ox)/vp.s,y=(vp.oy-(e.clientY-r.top))/vp.s;
    $('#sbXY').textContent=`X ${fx(x,1).padStart(8)}   Y ${fx(y,1).padStart(8)}`;
    const t=e.target.closest&&e.target.closest('[data-tip]');
    if(t&&!drag){tip.textContent=t.dataset.tip;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8)+'px';tip.style.top=(e.clientY+16)+'px';}else tip.style.display='none';
  });
  svg.addEventListener('mouseleave',()=>{tip.style.display='none';$('#sbXY').textContent='X —   Y —';});
  svg.addEventListener('wheel',e=>{e.preventDefault();view.zoom=clamp(view.zoom*(e.deltaY<0?1.12:1/1.12),.5,8);renderCanvas();},{passive:false});
  new ResizeObserver(()=>renderCanvas()).observe($('#cv'));
  /* skróty */
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();if(openMenu>=0){openMenu=-1;renderMenu();}return;}
    if(e.ctrlKey&&e.key===','){e.preventDefault();openSettings(0);return;}
    if(e.target.tagName==='INPUT')return;
    if(e.ctrlKey&&e.key.toLowerCase()==='o'){e.preventDefault();openFolder();}
    else if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();openCsv();}
    else if(e.ctrlKey&&e.key.toLowerCase()==='s'){e.preventDefault();saveAll();}
    else if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
    else if(e.key==='F5'){e.preventDefault();recalc();}
    else if(!e.ctrlKey&&!e.altKey){
      const k=e.key.toLowerCase();
      if(k==='1')setMode('xray');else if(k==='2')setMode('top');else if(k==='3')setMode('bottom');
      else if(k==='r')xf('R90');else if(k==='f')fit();else if(k==='g'){view.grid=!view.grid;renderCanvas();}
      else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();const i=PARTS.findIndex(p=>p.id===curId),n=clamp(i+(e.key==='ArrowDown'?1:-1),0,PARTS.length-1);pick(PARTS[n].id);
        const el=$('.pi.sel');if(el)el.scrollIntoView({block:'nearest'});
      }
    }
  });
}
renderMenu();renderLegend();bind();refresh();
requestAnimationFrame(renderCanvas);
})();
</script>
